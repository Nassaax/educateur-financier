<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0C48A"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#101E33"/>
  <!-- Monogramme "E" aux terminaisons arrondies -->
  <g fill="url(#gold)">
    <rect x="30" y="24" width="12" height="52" rx="6"/>
    <rect x="30" y="24" width="38" height="12" rx="6"/>
    <rect x="30" y="44" width="30" height="12" rx="6"/>
    <rect x="30" y="64" width="38" height="12" rx="6"/>
  </g>
  <!-- Accent croissance : la pointe casse le cadre du E -->
  <path d="M58 40 L79 19" stroke="#E0C48A" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 19 L80 19 L80 35" fill="none" stroke="#E0C48A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
